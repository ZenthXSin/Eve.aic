[package]
name = "eve-web-panel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
eve-web-panel-api = { path = "../web-panel-api" }
eve-control-api = { path = "../control-api" }
eve-memory-api = { path = "../memory-api" }
eve-session-api = { path = "../session-api" }
axum = { version = "=0.8.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net"] }

[dev-dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls-native-roots"] }
