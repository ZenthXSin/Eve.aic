[package]
name = "eve-app"
default-run = "eve"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "eve"
path = "src/main.rs"

[[bin]]
name = "eve-qqbot"
path = "src/bin/qqbot.rs"

[[bin]]
name = "eve-cognition"
path = "src/bin/cognition.rs"

[dependencies]
eve-agent-prompt = { path = "../agent-prompt" }
eve-cognition-api = { path = "../cognition-api" }
eve-cognition-plugin = { path = "../cognition-plugin" }
eve-cognition-loop-api = { path = "../cognition-loop-api" }
eve-cognition-loop-plugin = { path = "../cognition-loop-plugin" }
eve-config-api = { path = "../config-api" }
eve-config-plugin = { path = "../config-plugin" }
eve-control-api = { path = "../control-api" }
eve-control-plugin = { path = "../control-plugin" }
eve-kernel = { path = "../kernel" }
eve-llm-api = { path = "../llm-api" }
eve-llm-openai = { path = "../llm-openai" }
eve-message-api = { path = "../message-api" }
eve-message-plugin = { path = "../message-plugin" }
eve-plugin-api = { path = "../plugin-api" }
eve-qqbot-plugin = { path = "../qqbot-plugin" }
eve-runtime = { path = "../runtime" }
eve-session-api = { path = "../session-api" }
eve-session-plugin = { path = "../session-plugin" }
eve-state-postgres = { path = "../state-postgres" }
eve-training-api = { path = "../training-api" }
eve-training-plugin = { path = "../training-plugin" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }

[dev-dependencies]
postgres = "0.19.14"
tempfile.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
