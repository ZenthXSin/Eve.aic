[package]
name = "eve-app"
default-run = "eve"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "eve"
path = "src/main.rs"

[[bin]]
name = "eve-qqbot"
path = "src/bin/qqbot.rs"

[[bin]]
name = "eve-cognition"
path = "src/bin/cognition.rs"

[[bin]]
name = "eve-message-evaluate"
path = "src/bin/message-evaluate.rs"

[[bin]]
name = "eve-memory"
path = "src/bin/memory.rs"

[dependencies]
eve-action-api = { path = "../action-api" }
eve-action-plugin = { path = "../action-plugin" }
eve-artifact-file = { path = "../artifact-file" }
eve-message-diagnostics = { path = "../message-diagnostics" }
eve-agent-prompt = { path = "../agent-prompt" }
eve-web-panel-api = { path = "../web-panel-api" }
eve-web-panel = { path = "../web-panel" }
eve-cognition-api = { path = "../cognition-api" }
eve-cognition-plugin = { path = "../cognition-plugin" }
eve-file-observer = { path = "../file-observer" }
eve-cognition-loop-api = { path = "../cognition-loop-api" }
eve-cognition-loop-plugin = { path = "../cognition-loop-plugin" }
eve-config-api = { path = "../config-api" }
eve-config-plugin = { path = "../config-plugin" }
eve-control-api = { path = "../control-api" }
eve-control-plugin = { path = "../control-plugin" }
eve-jev = { path = "../jev" }
eve-kernel = { path = "../kernel" }
eve-learning-api = { path = "../learning-api" }
eve-plan-api = { path = "../plan-api" }
eve-plan-plugin = { path = "../plan-plugin" }
eve-learning-plugin = { path = "../learning-plugin" }
eve-llm-api = { path = "../llm-api" }
eve-llm-openai = { path = "../llm-openai" }
eve-message-api = { path = "../message-api" }
eve-message-plugin = { path = "../message-plugin" }
eve-memory-api = { path = "../memory-api" }
eve-memory-plugin = { path = "../memory-plugin" }
eve-plugin-api = { path = "../plugin-api" }
eve-qqbot-plugin = { path = "../qqbot-plugin" }
eve-segment-api = { path = "../segment-api" }
eve-segment-plugin = { path = "../segment-plugin" }
eve-runtime = { path = "../runtime" }
eve-session-api = { path = "../session-api" }
eve-session-plugin = { path = "../session-plugin" }
eve-state-postgres = { path = "../state-postgres" }
eve-training-api = { path = "../training-api" }
eve-training-plugin = { path = "../training-plugin" }
serde.workspace = true
serde_json.workspace = true
ring.workspace = true
tokio = { workspace = true, features = ["signal"] }

[dev-dependencies]
postgres = "0.19.14"
tempfile.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
