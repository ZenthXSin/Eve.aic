name: 主模型真实多轮验收

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths: [.github/workflows/model-acceptance.yml]

permissions:
  contents: read

jobs:
  diagnose:
    if: >-
      github.event.pull_request.number == 67 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'codex/chat-primary-model'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 诊断 Chat 工具回复结构（不输出正文或凭据）
        env:
          EVE_OPENAI_API_KEY: ${{ secrets.EVE_OPENAI_API_KEY }}
        shell: python
        run: |
          import json, os, urllib.request, urllib.error
          body = {
              "model": "deepseek-v4.1-flash",
              "messages": [{"role": "user", "content": "请调用一次 echo 工具，参数 text 为 EVE_CHAT_PROBE，然后回复该口令。"}],
              "tools": [{"type": "function", "function": {"name": "echo", "description": "返回输入文本。", "parameters": {"type": "object", "properties": {"text": {"type": "string"}}, "required": ["text"], "additionalProperties": False}}}],
              "max_tokens": 512,
              "stream": False,
          }
          request = urllib.request.Request(
              "https://ai.xn--rhqr8xvr4ahqsgka.com/v1/chat/completions",
              data=json.dumps(body).encode(),
              headers={"Authorization": "Bearer " + os.environ["EVE_OPENAI_API_KEY"], "Content-Type": "application/json"},
              method="POST",
          )
          report = {"diagnostic": "chat_tool_response_shape", "model": "deepseek-v4.1-flash"}
          try:
              with urllib.request.urlopen(request, timeout=120) as response:
                  report["http_status"] = response.status
                  raw = response.read(1048577)
                  report["within_size_limit"] = len(raw) <= 1048576
                  if report["within_size_limit"]:
                      data = json.loads(raw)
                      report["has_error"] = "error" in data
                      choices = data.get("choices")
                      report["choice_count"] = len(choices) if isinstance(choices, list) else None
                      if isinstance(choices, list) and choices:
                          choice = choices[0]
                          reason = choice.get("finish_reason")
                          report["finish_reason"] = reason if reason in ("stop", "tool_calls", "length", "content_filter", "function_call") else "other"
                          message = choice.get("message", {})
                          report["known_message_fields"] = [key for key in ("role", "content", "reasoning_content", "tool_calls", "refusal", "audio", "function_call") if key in message]
                          report["text_nonempty"] = bool(message.get("content"))
                          report["reasoning_nonempty"] = bool(message.get("reasoning_content"))
                          calls = message.get("tool_calls")
                          report["tool_call_count"] = len(calls) if isinstance(calls, list) else 0
                          report["tool_arguments_are_objects"] = all(isinstance(json.loads(call["function"]["arguments"]), dict) for call in calls) if isinstance(calls, list) else None
          except urllib.error.HTTPError as error:
              report["http_status"] = error.code
          except urllib.error.URLError:
              report["transport_error"] = True
          except (ValueError, TypeError, KeyError):
              report["invalid_response"] = True
          print(json.dumps(report, ensure_ascii=False, sort_keys=True))
