name: 主模型真实多轮验收

on:
  # 单次 DeepSeek 实测；仅接受当前仓库的已审阅分支，检出固定 CI 成功版本。
  pull_request:
    types: [synchronize]
    branches: [main]
    paths: [.github/workflows/model-acceptance.yml]
  workflow_dispatch:
    inputs:
      model:
        description: 支持所选 Chat/Responses 子集的主模型
        required: true
        default: deepseek-v4.1-flash
        type: string
      protocol:
        description: 模型 API 协议
        required: true
        default: chat
        type: choice
        options: [chat, responses]
      reasoning_effort:
        description: 可选参数，模型不支持时留空
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: eve-model-acceptance
  cancel-in-progress: false

jobs:
  check:
    # PR 实测固定检出已通过 CI #93 的版本；不执行随后更改的 PR 代码。
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.number == 67 &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref == 'codex/chat-primary-model')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EVE_OPENAI_BASE_URL: "https://ai.xn--rhqr8xvr4ahqsgka.com"
    steps:
      - name: 检查主模型凭据
        env:
          EVE_OPENAI_API_KEY: ${{ secrets.EVE_OPENAI_API_KEY }}
        run: |
          if [ -z "$EVE_OPENAI_API_KEY" ]; then
            echo "请在仓库 Actions Secrets 配置 EVE_OPENAI_API_KEY。"
            exit 1
          fi
      - name: 检出已验证版本
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && 'fa010163ee2bed20a34e489e4913aee8141f10e3' || github.sha }}
          persist-credentials: false
      - name: 安装 Rust
        run: rustup toolchain install 1.89.0 --profile minimal
      - name: 构建核心入口
        run: cargo +1.89.0 build -p eve-app --bin eve --example model_acceptance --locked
      - name: 验收多轮与新进程恢复
        env:
          EVE_OPENAI_API_KEY: ${{ secrets.EVE_OPENAI_API_KEY }}
          EVE_OPENAI_MODEL: ${{ inputs.model || 'deepseek-v4.1-flash' }}
          EVE_OPENAI_PROTOCOL: ${{ inputs.protocol || 'chat' }}
          EVE_OPENAI_REASONING_EFFORT: ${{ inputs.reasoning_effort }}
          EVE_OPENAI_TIMEOUT_SECONDS: "120"
          EVE_OPENAI_MAX_OUTPUT_TOKENS: "512"
          EVE_LLM_RESPONSE_MODE: complete
        run: ./target/debug/examples/model_acceptance "$RUNNER_TEMP/eve-model-check"
      - name: 保留无正文的验收报告
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eve-model-acceptance-report
          path: ${{ runner.temp }}/eve-model-check/acceptance.json
          if-no-files-found: ignore
          retention-days: 7
