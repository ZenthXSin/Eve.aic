name: Deno 基座检查

on:
  pull_request:
  push:
    branches: [codex/rebuild-20261111]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: deno fmt --check
      - run: deno lint
      - run: deno task check
      - run: deno task test
