name: 跨平台构建与发布

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths: ['packaging/**', 'scripts/package-*.ps1', 'scripts/package-*.py', 'scripts/test-*package.py', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: 构建与验收 / ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: windows-x64, runner: windows-latest, target: x86_64-pc-windows-msvc, os: windows}
          - {label: windows-arm64, runner: windows-11-arm, target: aarch64-pc-windows-msvc, os: windows}
          - {label: linux-x64, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, os: linux}
          - {label: linux-arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, os: linux}
          - {label: macos-x64, runner: macos-15-intel, target: x86_64-apple-darwin, os: macos}
          - {label: macos-arm64, runner: macos-15, target: aarch64-apple-darwin, os: macos}
    steps:
      - name: 检出精确源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 安装 Rust 1.89 与目标
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.89.0
          targets: ${{ matrix.target }}
      - name: 构建原生运行器
        env:
          RUSTFLAGS: ${{ matrix.os == 'windows' && '-C target-feature=+crt-static' || '' }}
          CARGO_INCREMENTAL: '0'
          MACOSX_DEPLOYMENT_TARGET: '11.0'
          EVE_BUILD_TARGET: ${{ matrix.target }}
        shell: bash
        run: cargo build -p eve-app --bins --release --locked --target "$EVE_BUILD_TARGET"
      - name: 打包运行器与固定 QQ 运行环境
        env:
          EVE_BUILD_TARGET: ${{ matrix.target }}
        shell: bash
        run: python scripts/package-portable.py --target "$EVE_BUILD_TARGET"
      - name: 解压后原生进程验收
        shell: bash
        run: python scripts/test-portable-package.py dist
      - name: 上传已验收便携包
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Eve-${{ matrix.label }}
          path: |
            dist/Eve-*.zip
            dist/Eve-*.tar.gz
            dist/SHA256SUMS-*.txt
            dist/acceptance-*.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: 自动发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 下载六个平台的验收产物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: Eve-*
          path: release-assets
          merge-multiple: true
      - name: 核对完整版本并生成校验清单
        env:
          EVE_RELEASE_SHA: ${{ github.sha }}
          EVE_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, re
          folder = pathlib.Path('release-assets')
          tag = os.environ['EVE_RELEASE_TAG']
          if not re.fullmatch(r'v\d+\.\d+\.\d+(?:-[A-Za-z0-9][A-Za-z0-9.-]*)?', tag):
              raise SystemExit('标签必须为 v主版本.次版本.补丁版本，可带预发布后缀')
          labels = {'windows-x64', 'windows-arm64', 'linux-x64', 'linux-arm64', 'macos-x64', 'macos-arm64'}
          reports = {}
          checksums = []
          for file in sorted(folder.glob('acceptance-*.json')):
              report = json.loads(file.read_text(encoding='utf-8'))
              label = report['platform_label']
              if label not in labels or label in reports or report['source_commit'] != os.environ['EVE_RELEASE_SHA']:
                  raise SystemExit('平台重复、缺失或源码版本不一致')
              archive = folder / report['archive']
              with archive.open('rb') as reader:
                  checksum = hashlib.file_digest(reader, 'sha256').hexdigest()
              if checksum != report['archive_sha256'] or not all(report[key] for key in
                  ['unicode_and_space_path', 'web_http', 'memory_and_learning_views', 'qq_segmented_delivery', 'recovery_without_replay']):
                  raise SystemExit('发行包散列或进程验收不符')
              reports[label] = report
              checksums.append(f'{checksum}  {archive.name}\n')
          if set(reports) != labels:
              raise SystemExit('六个平台没有全部完成原生验收，不发布部分 Release')
          (folder / 'SHA256SUMS.txt').write_text(''.join(checksums), encoding='utf-8')
          (folder / 'release-verification.json').write_text(json.dumps(reports, ensure_ascii=False, indent=2), encoding='utf-8')
          for file in list(folder.glob('acceptance-*.json')) + list(folder.glob('SHA256SUMS-*.txt')):
              file.unlink()
          pathlib.Path('release-notes.md').write_text(
              '# Eve ' + tag + '\n\n'
              'Windows、Linux、macOS，各提供 x64 与 ARM64 原生运行包。包含 Eve 运行器、Web 页面、固定 Node 与 QQ 桥接，无需安装 Rust 或 Node。\n\n'
              '完整解压后使用包内 Start-Eve 启动；首次输入自己的主模型与 QQ 密钥，再使用 Open-Panel 打开本机面板。详细说明在包内。\n\n'
              'Windows 使用 ZIP；Linux/macOS 使用 tar.gz 以保留执行权限。Linux 需 Ubuntu 24.04 或相容 glibc，macOS 需 11+，macOS 包未签名/公证。\n\n'
              '六个平台均已通过原生 exe/程序启动、中文与空格路径、Web 鉴权、记忆/学习读取、分段投递与恢复零重放验收。使用合成凭据与回环替身，没有连接正式 QQ 或外部模型。\n\n'
              '源码提交：`' + os.environ['EVE_RELEASE_SHA'] + '`。发行包不含用户密钥与历史数据；校验见 SHA256SUMS.txt，原生验收记录见 release-verification.json。\n', encoding='utf-8')
          PY
      - name: 完整上传后发布，已发布版本不覆盖
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVE_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$EVE_RELEASE_TAG" --json isDraft --jq .isDraft > release-state.txt 2>/dev/null; then
            if [ "$(cat release-state.txt)" != "true" ]; then
              echo '该版本已经公开发布，不覆盖已发布文件；请使用新版本标签。'
              exit 1
            fi
            gh release upload "$EVE_RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$EVE_RELEASE_TAG" release-assets/* --verify-tag --draft --title "Eve $EVE_RELEASE_TAG" --notes-file release-notes.md
          fi
          if [[ "$EVE_RELEASE_TAG" == *-* ]]; then
            gh release edit "$EVE_RELEASE_TAG" --draft=false --prerelease --notes-file release-notes.md
          else
            gh release edit "$EVE_RELEASE_TAG" --draft=false --latest --notes-file release-notes.md
          fi
