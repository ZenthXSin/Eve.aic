name: 跨平台构建与发布

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths: ['packaging/**', 'scripts/package-*.ps1', 'scripts/package-*.py', 'scripts/test-*package.py', 'scripts/test-launcher-signal.py', 'scripts/*client-update*.mjs', 'scripts/client_update_native.py', 'scripts/release-portable.py', 'scripts/test-release-portable.py', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  prepare:
    name: 校验发行逻辑与分配版本
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      publish: ${{ steps.version.outputs.publish }}
      automatic: ${{ steps.version.outputs.automatic }}
    steps:
      - name: 检出精确源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 验证版本选择、失败保护和草稿恢复
        run: python scripts/test-release-portable.py
      - name: 安装与便携包一致的 Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.0'
      - name: 验证客户端更新与恢复
        run: node scripts/test-client-update.mjs
      - name: 为主线或标签选择发行版本
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release-portable.py prepare

  build:
    name: 构建与验收 / ${{ matrix.label }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: windows-x64, runner: windows-latest, target: x86_64-pc-windows-msvc, os: windows}
          - {label: windows-arm64, runner: windows-11-arm, target: aarch64-pc-windows-msvc, os: windows}
          - {label: linux-x64, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, os: linux}
          - {label: linux-arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, os: linux}
          - {label: macos-x64, runner: macos-15-intel, target: x86_64-apple-darwin, os: macos}
          - {label: macos-arm64, runner: macos-15, target: aarch64-apple-darwin, os: macos}
    steps:
      - name: 检出精确源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 安装 Rust 1.89 与目标
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.89.0
          targets: ${{ matrix.target }}
      - name: 构建原生运行器
        env:
          RUSTFLAGS: ${{ matrix.os == 'windows' && '-C target-feature=+crt-static' || '' }}
          CARGO_INCREMENTAL: '0'
          MACOSX_DEPLOYMENT_TARGET: '11.0'
          EVE_BUILD_TARGET: ${{ matrix.target }}
        shell: bash
        run: cargo build -p eve-app --bins --release --locked --target "$EVE_BUILD_TARGET"
      - name: 打包运行器与固定 QQ 运行环境
        env:
          EVE_BUILD_TARGET: ${{ matrix.target }}
          EVE_RELEASE_VERSION: ${{ needs.prepare.outputs.release_tag }}
        shell: bash
        run: python scripts/package-portable.py --target "$EVE_BUILD_TARGET"
      - name: 解压后原生进程验收
        shell: bash
        run: python scripts/test-portable-package.py dist
      - name: 上传已验收便携包
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Eve-${{ matrix.label }}
          path: |
            dist/Eve-*.zip
            dist/Eve-*.tar.gz
            dist/SHA256SUMS-*.txt
            dist/acceptance-*.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: 自动发布 Release
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: portable-release-publish
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - name: 检出精确源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 下载六个平台的验收产物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: Eve-*
          path: release-assets
          merge-multiple: true
      - name: 核对主线 CI 和资产，完整上传后公开
        env:
          GH_TOKEN: ${{ github.token }}
          EVE_RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          EVE_RELEASE_AUTOMATIC: ${{ needs.prepare.outputs.automatic }}
        run: python scripts/release-portable.py publish
