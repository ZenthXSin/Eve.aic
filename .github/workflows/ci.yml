name: Rust 持续集成

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_revision:
        description: '可选：核验指定的完整 40 位源码 commit SHA'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stable:
    name: Stable / ubuntu-latest
    runs-on: ubuntu-latest
    # 统一编译示例，避免 cargo run 改变包特征后重复编译。
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        shell: pwsh
    steps:
      - name: 解析本次核验的源码版本
        id: ci-source
        shell: bash
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_REQUESTED_SOURCE: ${{ inputs.source_revision }}
          CI_EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re

          requested = os.environ.get("CI_REQUESTED_SOURCE", "")
          selected = ""
          if os.environ["CI_EVENT_NAME"] == "workflow_dispatch" and requested:
              if re.fullmatch(r"[0-9a-fA-F]{40}", requested) is None:
                  raise SystemExit("source_revision 必须是完整 40 位十六进制 commit SHA")
              selected = requested.lower()
          expected = selected or os.environ["CI_EVENT_SHA"]
          if re.fullmatch(r"[0-9a-f]{40}", expected) is None:
              raise SystemExit("事件源码 SHA 无效")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"checkout_ref={selected}\nexpected_sha={expected}\n")
          PY
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.ci-source.outputs.checkout_ref }}
      - name: 核对实际源码并记录工作流来源
        shell: bash
        env:
          CI_EXPECTED_SOURCE: ${{ steps.ci-source.outputs.expected_sha }}
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_EVENT_SHA: ${{ github.sha }}
          CI_WORKFLOW_SHA: ${{ github.workflow_sha }}
          CI_RUN_ID: ${{ github.run_id }}
          CI_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          actual = subprocess.check_output(
              ["git", "--no-optional-locks", "rev-parse", "HEAD"], text=True
          ).strip()
          expected = os.environ["CI_EXPECTED_SOURCE"]
          identity = {
              "workflow_sha": os.environ["CI_WORKFLOW_SHA"],
              "github_sha": os.environ["CI_EVENT_SHA"],
              "actual_source_sha": actual,
              "expected_source_sha": expected,
              "event_name": os.environ["CI_EVENT_NAME"],
              "run_id": os.environ["CI_RUN_ID"],
              "run_attempt": os.environ["CI_RUN_ATTEMPT"],
          }
          if any(re.fullmatch(r"[0-9a-f]{40}", identity[key]) is None
                 for key in ("workflow_sha", "github_sha", "actual_source_sha", "expected_source_sha")):
              raise SystemExit("工作流或检出源码身份无效")
          if any(re.fullmatch(r"[1-9][0-9]*", identity[key]) is None
                 for key in ("run_id", "run_attempt")):
              raise SystemExit("工作流运行身份无效")
          print(json.dumps(identity, ensure_ascii=False, sort_keys=True))
          if actual != expected:
              raise SystemExit("实际检出 HEAD 与要求核验的完整源码 SHA 不一致")
          PY
      - name: 安装 Rust Stable 与检查组件
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable
      - name: 检查代码格式
        run: cargo fmt -- --check
      - name: 安装与便携包一致的 Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.0'
      - name: 准备 Linux 脚本与成员项目的真实隔离环境
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap python3
          # 固定路径的隔离执行器复用 setup-node 的版本，避免再下载一份系统 Node。
          ci_node="$(readlink -f -- "$(command -v node)")"
          test "$("$ci_node" --version)" = v22.22.0
          if [ "$ci_node" != /usr/bin/node ]; then
            sudo ln -sfnT -- "$ci_node" /usr/bin/node
          fi
          # Ubuntu 24.04 的 AppArmor 默认限制非特权用户命名空间；与成员项目验收保持一致。
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-all --ro-bind / / --dev /dev --proc /proc /usr/bin/true
          /usr/bin/python3 --version
          test "$(/usr/bin/node --version)" = v22.22.0
          node_mounts=(--ro-bind /usr/lib /usr/lib --ro-bind /lib /lib)
          if [ -d /lib64 ]; then node_mounts+=(--ro-bind /lib64 /lib64); fi
          bwrap --unshare-all --cap-drop ALL --clearenv "${node_mounts[@]}" \
            --proc /proc --dev /dev --ro-bind "$ci_node" /runtime/node \
            /runtime/node --no-addons --jitless --max-old-space-size=64 --max-semi-space-size=4 \
            -e 'if (process.version !== "v22.22.0") process.exit(1); console.log(process.version)'
      - name: 验证自动发行的版本与恢复语义
        run: python -X utf8 scripts/test-release-portable.py
      - name: 验证 Debian 12 生产证据与失败产物拒绝
        run: python -X utf8 scripts/test-debian12-release.py
      - name: 验证打包下载总期限、容量和小文件归档
        run: python -X utf8 scripts/test-package-portable.py
      - name: 验证客户端更新、资产校验与失败恢复
        run: node scripts/test-client-update.mjs
      - name: 验证启动器能力开关与内置脚本运行时
        if: runner.os == 'Linux'
        run: node --test scripts/test-launcher-features.mjs
      - name: 验证实时升级切换、失败回退与不回放
        run: |
          $output = & python -X utf8 scripts/test-self-upgrade-runtime.py 2>&1
          $result = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          if ($result -ne 0) {
            $details = ($output -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=实时升级进程验收失败::$details"
            exit $result
          }
      - name: 验证源码自动同步、检查失败与空闲切换
        run: |
          $output = & python -X utf8 scripts/test-source-update.py 2>&1
          $result = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          if ($result -ne 0) {
            $details = ($output -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=源码自动同步验收失败::$details"
            exit $result
          }
      - name: 验证资源配额、可用内存与编译阶段并发
        run: python -X utf8 scripts/test-build-resources.py
      - name: 验证 Linux 外层守护、孤儿清理与两层崩溃恢复
        run: python -X utf8 scripts/test-service-guard.py
      - name: 验证 Linux 完整运行包交接、持久回退锚点与熔断
        if: runner.os == 'Linux'
        run: python -X utf8 scripts/test-host-runtime-bridge.py
      - name: 验证 Linux 服务启动、停止和重复启动保护
        if: runner.os == 'Linux'
        run: python -X utf8 scripts/test-eve-service.py
      - name: 验证 Linux 分卷校验与进程身份绑定
        run: python -X utf8 scripts/test-linux-handoff.py
      - name: 检查所有构建目标
        run: cargo check --workspace --all-targets --locked
      - name: 检查 Clippy 警告
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: 运行测试与文档测试
        run: |
          cargo tree --workspace -e features -i serde_json --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --workspace --locked --no-fail-fast
      - name: 验证预编译目标的参数与失败传播
        run: python -X utf8 scripts/test-run-prebuilt.py
      - name: 统一编译进程验收入口和示例
        id: process-binaries
        run: cargo build -p eve-app -p eve-runtime -p eve-cognition-plugin --bins --examples --locked
      # 独立进程验收继续收集失败，避免每修一处重跑全量才能发现下一处；失败仍使作业失败。
      - name: 验证工作区测试证据复用与重启不重跑
        if: ${{ !cancelled() && steps.process-binaries.outcome == 'success' }}
        run: |
          $env:EVE_QQBOT_BINARY = "target/debug/eve-qqbot"
          python -X utf8 connectors/qqbot/test/workspace_node_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 验证后台策略通过真实文件回执学习与恢复
        if: ${{ !cancelled() && steps.process-binaries.outcome == 'success' }}
        run: |
          $env:EVE_QQBOT_BINARY = "target/debug/examples/task_strategy"
          python -X utf8 connectors/qqbot/test/task_strategy_process_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 验证 Web 插件页、配置恢复与 QQ 插件启停
        if: ${{ !cancelled() && steps.process-binaries.outcome == 'success' }}
        run: |
          $qqBinary = "target/debug/eve-qqbot"
          python -X utf8 scripts/test-web-plugins.py $qqBinary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 验证群聊插话的判断与完整回复链路
        if: ${{ !cancelled() && steps.process-binaries.outcome == 'success' }}
        run: |
          $chimeBinary = "target/debug/eve-chime"
          python -X utf8 scripts/test-chime.py $chimeBinary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 验证引用和附件消息的记忆采集及重启不重放
        if: ${{ !cancelled() && steps.process-binaries.outcome == 'success' }}
        run: |
          python -X utf8 connectors/qqbot/test/snapshot_reader_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:EVE_QQBOT_BINARY = "target/debug/eve-qqbot"
          python -X utf8 connectors/qqbot/test/memory_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 验证自主发言、等待、提醒与真实投递凭据
        if: ${{ !cancelled() && steps.process-binaries.outcome == 'success' }}
        run: |
          $env:EVE_QQBOT_BINARY = "target/debug/eve-qqbot"
          python -X utf8 connectors/qqbot/test/progress_narration_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 connectors/qqbot/test/live_dialogue_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 connectors/qqbot/test/natural_progress_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 connectors/qqbot/test/natural_speech_parts_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 connectors/qqbot/test/live_reminder_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 connectors/qqbot/test/task_progress_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 connectors/qqbot/test/default_goal_journey_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 验证唤醒静默、原工具回执与跨重启零表达
        if: ${{ !cancelled() && steps.process-binaries.outcome == 'success' }}
        run: |
          $env:EVE_QQBOT_BINARY = "target/debug/eve-qqbot"
          python -X utf8 connectors/qqbot/test/wakeup_silence_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 验证主人跨群账号、撤权与旧身份兼容
        if: ${{ !cancelled() && steps.process-binaries.outcome == 'success' }}
        run: |
          $env:EVE_QQBOT_BINARY = "target/debug/eve-qqbot"
          python -X utf8 connectors/qqbot/test/owner_account_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 connectors/qqbot/test/public_source_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 connectors/qqbot/test/member_network_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 验证自然待办、计划确认与原状态恢复
        if: ${{ !cancelled() && steps.process-binaries.outcome == 'success' }}
        run: |
          $env:EVE_QQBOT_BINARY = "target/debug/eve-qqbot"
          python -X utf8 connectors/qqbot/test/natural_goal_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 验证独立 Web 自然待办、研究计划与重启证据
        if: ${{ !cancelled() && steps.process-binaries.outcome == 'success' }}
        run: |
          $env:EVE_WEB_BINARY = "target/debug/eve-web"
          python -X utf8 scripts/test-web-goals.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 验证 QQ 与独立 Web 适配器切换的实际协议和重启去重
        if: ${{ !cancelled() && steps.process-binaries.outcome == 'success' && runner.os == 'Linux' }}
        run: |
          $env:EVE_QQBOT_BINARY = "target/debug/eve-qqbot"
          $env:EVE_WEB_BINARY = "target/debug/eve-web"
          python -X utf8 connectors/qqbot/test/model_adapter_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 scripts/test-web-model-adapter.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 验证浏览器中的插件配置、冲突、启停与窄屏
        if: ${{ !cancelled() && steps.process-binaries.outcome == 'success' && runner.os == 'Linux' }}
        run: |
          $browserDirectory = Join-Path $env:RUNNER_TEMP "eve-web-browser"
          npm install --prefix $browserDirectory --no-audit --no-fund playwright-core@1.57.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:EVE_PLAYWRIGHT_MODULE = Join-Path $browserDirectory "node_modules/playwright-core/index.mjs"
          $env:EVE_TEST_BROWSER = (Get-Command google-chrome -ErrorAction Stop).Source
          python -X utf8 scripts/test-web-goals.py WebGoalAcceptance.test_research_then_real_browser_repairs_failed_style_and_keeps_verified_artifact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 scripts/test-web-plugins.py target/debug/eve-qqbot --browser
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 scripts/test-web-chat.py --browser
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 验证 150k 上下文主动压缩与重启复用
        if: ${{ !cancelled() && steps.process-binaries.outcome == 'success' }}
        run: |
          $env:EVE_QQBOT_BINARY = "target/debug/eve-qqbot"
          python -X utf8 connectors/qqbot/test/context_compaction_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 connectors/qqbot/test/compaction_stream_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 验证交互记忆三次独立进程恢复
        if: ${{ !cancelled() && steps.process-binaries.outcome == 'success' }}
        run: |
          $memoryDirectory = Join-Path $env:RUNNER_TEMP "eve-memory-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $before = ""
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            cargo run -p eve-memory-plugin --example recovery --locked -- $memoryDirectory
            if ($LASTEXITCODE -ne 0) { throw "交互记忆恢复进程失败" }
            $bytes = [System.IO.File]::ReadAllText((Join-Path $memoryDirectory "state.json"))
            if ($attempt -gt 1 -and $bytes -cne $before) { throw "只读恢复改写交互记忆" }
            $before = $bytes
          }
      - name: 验证偏好提炼三次独立进程恢复
        if: ${{ !cancelled() && steps.process-binaries.outcome == 'success' }}
        run: |
          $learningDirectory = Join-Path $env:RUNNER_TEMP "eve-learning-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $before = ""
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            cargo run -p eve-learning-plugin --example recovery --locked -- $learningDirectory
            if ($LASTEXITCODE -ne 0) { throw "偏好提炼恢复进程失败" }
            $bytes = [System.IO.File]::ReadAllText((Join-Path $learningDirectory "state.json"))
            if ($attempt -eq 3 -and $bytes -cne $before) { throw "已恢复的偏好提炼状态被重写" }
            $before = $bytes
          }
      - name: 验证核心入口帮助
        if: ${{ !cancelled() && steps.process-binaries.outcome == 'success' }}
        run: python -X utf8 scripts/run-prebuilt.py --bin eve -- --help
      - name: 验证内生反思入口帮助
        if: ${{ !cancelled() && steps.process-binaries.outcome == 'success' }}
        run: python -X utf8 scripts/run-prebuilt.py --bin eve-cognition -- --help
      - name: 验证主模型多轮验收帮助
        if: ${{ !cancelled() && steps.process-binaries.outcome == 'success' }}
        run: python -X utf8 scripts/run-prebuilt.py --example model_acceptance -- --help
      - name: 运行插件协作验收
        if: ${{ !cancelled() && steps.process-binaries.outcome == 'success' }}
        run: python -X utf8 scripts/run-prebuilt.py --bin eve-runtime
      - name: 验证取消生命周期等待后的收尾
        if: ${{ !cancelled() && steps.process-binaries.outcome == 'success' }}
        run: python -X utf8 scripts/run-prebuilt.py --example lifecycle_operations
      - name: 验证集成后的 Mock LLM 工具闭环
        if: ${{ !cancelled() && steps.process-binaries.outcome == 'success' }}
        run: python -X utf8 scripts/run-prebuilt.py --example llm_tool_loop
      - name: 验证 AGENT 文件身份与工具往返
        if: ${{ !cancelled() && steps.process-binaries.outcome == 'success' }}
        run: |
          function Invoke-Agent([string] $Path) {
            if ($Path) {
              $output = @(& python -X utf8 scripts/run-prebuilt.py --example agent_prompt -- $Path)
            } else {
              $output = @(& python -X utf8 scripts/run-prebuilt.py --example agent_prompt)
            }
            if ($LASTEXITCODE -ne 0 -or $output.Count -ne 1) { throw "Agent 身份示例失败" }
            Write-Host $output[0]
            $report = $output[0] | ConvertFrom-Json -AsHashtable
            if ($report.source -cne "file" -or $report.revision -cnotmatch '^sha256:[0-9a-f]{64}$' -or
                $report.prompt_bytes -le 0 -or $report.provider_requests -ne 2 -or $report.started_tools -ne 1) {
              throw "Agent 来源、版本或工具往返不符"
            }
            return $report
          }
          $default = Invoke-Agent ""
          $agentFile = Join-Path $env:RUNNER_TEMP "eve-agent-$env:GITHUB_RUN_ID.md"
          $body = "# 自定义 Eve 身份"
          [System.IO.File]::WriteAllText($agentFile, $body, [System.Text.UTF8Encoding]::new($false))
          $explicit = Invoke-Agent $agentFile
          if ($explicit.revision -ceq $default.revision -or
              $explicit.prompt_bytes -ne [System.Text.Encoding]::UTF8.GetByteCount($body)) {
            throw "显式文件没有替换默认文件身份"
          }
      - name: 验证认知状态、权限与三次独立进程恢复
        if: ${{ !cancelled() && steps.process-binaries.outcome == 'success' }}
        run: |
          $cognitionDirectory = Join-Path $env:RUNNER_TEMP "eve-cognition-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $previousBytes = ""
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            $output = @(& python -X utf8 scripts/run-prebuilt.py --example cognition_state -- $cognitionDirectory)
            if ($LASTEXITCODE -ne 0 -or $output.Count -ne 1) { throw "认知状态进程验收失败" }
            Write-Host $output[0]
            $report = $output[0] | ConvertFrom-Json -AsHashtable
            $restored = if ($attempt -eq 1) { 0 } elseif ($attempt -eq 2) { 4 } else { 5 }
            $revision = if ($attempt -eq 1) { 4 } else { 5 }
            $blocked = if ($attempt -eq 1) { 0 } else { 1 }
            if ($report.restored_revision -ne $restored -or $report.revision -ne $revision -or
                $report.goals -ne 4 -or $report.public_goals -ne 1 -or $report.user_goals -ne 2 -or
                $report.ready_goals -ne 1 -or $report.completed_goals -ne 1 -or
                $report.waiting_goals -ne 1 -or $report.blocked_goals -ne $blocked -or
                $report.closed_services -ne $true -or $report.directory_reopened -ne $true -or
                $report.model_requests -ne 0 -or $report.tool_executions -ne 0) {
              throw "认知状态、权限、恢复或旧句柄收尾不符"
            }
            $bytes = [System.IO.File]::ReadAllText((Join-Path $cognitionDirectory "state.json"))
            $outer = $bytes | ConvertFrom-Json -AsHashtable
            $document = [System.Text.Encoding]::UTF8.GetString([byte[]] $outer.entries["eve.cognition"]["cognition.v1"]) | ConvertFrom-Json -AsHashtable
            $uncertain = if ($attempt -eq 1) { "Executing" } else { "Blocked" }
            if ($document.format_version -ne 1 -or $document.subject_id -cne "eve" -or
                $document.revision -ne $revision -or $document.state.goals["done"].status -cne "Completed" -or
                $document.state.goals["uncertain"].status -cne $uncertain) {
              throw "认知快照没有实际保存或在途恢复不符"
            }
            if ($attempt -eq 3 -and $bytes -cne $previousBytes) { throw "无变化恢复改写了状态文件" }
            $previousBytes = $bytes
          }
      - name: 验证配置插件及两次独立进程恢复
        if: ${{ !cancelled() && steps.process-binaries.outcome == 'success' }}
        run: |
          $env:EVE_LLM_MAX_PARALLEL_TOOL_CALLS = "10"
          $configDirectory = Join-Path $env:RUNNER_TEMP "eve-config-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $firstOutput = @(& python -X utf8 scripts/run-prebuilt.py --example configuration -- $configDirectory)
          if ($LASTEXITCODE -ne 0) { throw "首次配置示例执行失败" }
          $firstOutput | ForEach-Object { Write-Host $_ }
          if ($firstOutput.Count -ne 1 -or $firstOutput[0] -cne "启动并发：10；仅新请求：在途 10 / 新请求 11；立即替换：12；重启恢复：12。") {
            throw "首次配置验收结果不符"
          }
          $first = Get-Content -LiteralPath (Join-Path $configDirectory "config.json") -Raw -Encoding utf8 | ConvertFrom-Json -AsHashtable
          if ($first.format_version -ne 1 -or $first.current.revision -ne 2 -or $first.current.namespaces["runtime.llm"]["values"]["max_parallel_tool_calls"] -ne 12) {
            throw "首次配置文件修订或值不符"
          }
          $secondOutput = @(& python -X utf8 scripts/run-prebuilt.py --example configuration -- $configDirectory)
          if ($LASTEXITCODE -ne 0) { throw "第二次配置示例执行失败" }
          $secondOutput | ForEach-Object { Write-Host $_ }
          if ($secondOutput.Count -ne 1 -or $secondOutput[0] -cne "启动并发：12；仅新请求：在途 12 / 新请求 13；立即替换：14；重启恢复：14。") {
            throw "第二次启动必须恢复文件层配置并遮盖环境值 10"
          }
          $second = Get-Content -LiteralPath (Join-Path $configDirectory "config.json") -Raw -Encoding utf8 | ConvertFrom-Json -AsHashtable
          if ($second.current.revision -ne 4 -or $second.current.namespaces["runtime.llm"]["values"]["max_parallel_tool_calls"] -ne 14 -or $second.backups.Count -ne 4) {
            throw "第二次配置文件修订、值或备份不符"
          }
      - name: 验证四类模型配置、固定快照及独立进程恢复
        if: ${{ !cancelled() && steps.process-binaries.outcome == 'success' }}
        run: |
          $modelDirectory = Join-Path $env:RUNNER_TEMP "eve-models-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          for ($attempt = 1; $attempt -le 2; $attempt++) {
            $output = @(& python -X utf8 scripts/run-prebuilt.py --example model_roles -- $modelDirectory)
            if ($LASTEXITCODE -ne 0 -or $output.Count -ne 1) { throw "模型配置进程验收失败" }
            Write-Host $output[0]
            $report = $output[0] | ConvertFrom-Json -AsHashtable
            $restored = if ($attempt -eq 1) { 0 } else { 2 }
            if ($report.restored_revision -ne $restored -or
                $report.captured_revision -ne $attempt -or $report.current_revision -ne ($attempt + 1) -or
                $report.captured_primary -cne "primary-$attempt" -or $report.current_primary -cne "primary-$($attempt + 1)" -or
                $report.enabled_roles -ne 4 -or $report.semantic_dimensions -ne 768 -or $report.model_requests -ne 0) {
              throw "四角色、固定快照或恢复结果不符"
            }
            $state = Get-Content -LiteralPath (Join-Path $modelDirectory "config.json") -Raw -Encoding utf8 | ConvertFrom-Json -AsHashtable
            $models = $state.current.namespaces["runtime.models"]
            if ($state.format_version -ne 1 -or $models.schema_version -ne 1 -or
                $state.current.revision -ne ($attempt + 1) -or $state.backups.Count -ne ($attempt + 1) -or
                $models.values.primary_model -cne "primary-$($attempt + 1)" -or $models.values.semantic_dimensions -ne 768) {
              throw "模型配置实际落盘结果不符"
            }
            foreach ($role in @("primary", "auxiliary_small", "jev", "semantic")) {
              if ($models.values["${role}_enabled"] -ne $true -or $models.values["${role}_provider"] -cne "demo") {
                throw "模型角色配置未完整保存"
              }
            }
          }
      - name: 验证 OpenAI 本地 HTTP 与插件工具闭环
        if: ${{ !cancelled() && steps.process-binaries.outcome == 'success' }}
        run: python -X utf8 scripts/run-prebuilt.py --example openai_offline
      - name: 验证 Responses SSE、插件工具与会话保存
        if: ${{ !cancelled() && steps.process-binaries.outcome == 'success' }}
        run: python -X utf8 scripts/run-prebuilt.py --example streaming_offline
      - name: 验证显式取消、代际隔离及独立进程恢复
        if: ${{ !cancelled() && steps.process-binaries.outcome == 'success' }}
        run: |
          $controlDirectory = Join-Path $env:RUNNER_TEMP "eve-control-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          for ($attempt = 1; $attempt -le 2; $attempt++) {
            $output = @(& python -X utf8 scripts/run-prebuilt.py --example controlled_session -- $controlDirectory)
            if ($LASTEXITCODE -ne 0 -or $output.Count -ne 1) { throw "任务控制进程验收失败" }
            Write-Host $output[0]
            $report = $output[0] | ConvertFrom-Json -AsHashtable
            if ($report.cancelled_generation -ne 1 -or $report.completed_generation -ne 2 -or
                $report.turn_id -ne (2 * $attempt) -or $report.history_messages -ne (4 * $attempt) -or
                $report.tool_executions -ne 1 -or $report.provider_requests -ne 3 -or
                $report.saved_events -ne 1 -or $report.old_event_accepted -ne $false) { throw "取消、代际或恢复结果不符" }
          }
          $state = Get-Content -LiteralPath (Join-Path $controlDirectory "state.json") -Raw -Encoding utf8 | ConvertFrom-Json -AsHashtable
          $document = [System.Text.Encoding]::UTF8.GetString([byte[]] $state.entries["eve.session"]["sessions.v1"]) | ConvertFrom-Json -AsHashtable
          $snapshot = $document.sessions["controlled-session"]
          if ($snapshot.revision -ne 8 -or $snapshot.turns.Count -ne 4) { throw "控制会话磁盘修订不符" }
          foreach ($index in @(0, 2)) {
            if ($snapshot.turns[$index].status.state -ne "Failed" -or
                $snapshot.turns[$index].status.failure.code -ne "Cancelled" -or
                $snapshot.turns[$index].status.failure.started_tools -ne 0) { throw "取消记录未落盘" }
          }
          foreach ($index in @(1, 3)) {
            if ($snapshot.turns[$index].status.state -ne "Completed" -or
                $snapshot.turns[$index].status.messages.Count -ne 4) { throw "完整工具历史未保存" }
          }
      - name: 验证规则与 LLM 判断、混合修订及独立进程恢复
        if: ${{ !cancelled() && steps.process-binaries.outcome == 'success' }}
        run: |
          foreach ($example in @("message_relations", "natural_message_relations")) {
            $messageDirectory = Join-Path $env:RUNNER_TEMP "eve-$example-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
            for ($attempt = 1; $attempt -le 2; $attempt++) {
              $output = @(& python -X utf8 scripts/run-prebuilt.py --example $example -- $messageDirectory)
              if ($LASTEXITCODE -ne 0 -or $output.Count -ne 1) { throw "消息关系进程验收失败" }
              Write-Host $output[0]
              $report = $output[0] | ConvertFrom-Json -AsHashtable
              if ($example -ceq "natural_message_relations" -and $report.judge_requests -ne 2) { throw "内置判断请求次数不符" }
              if ($report.cancelled_generation -ne 1 -or $report.completed_generation -ne 2 -or
                  $report.intent_parts -ne 2 -or $report.turn_id -ne (2 * $attempt) -or
                  $report.history_messages -ne (4 * $attempt) -or $report.tool_executions -ne 1 -or
                  $report.provider_requests -ne 3 -or $report.saved_events -ne 1 -or
                  $report.old_event_accepted -ne $false) { throw "消息修订、代际或恢复结果不符" }
            }
            $state = Get-Content -LiteralPath (Join-Path $messageDirectory "state.json") -Raw -Encoding utf8 | ConvertFrom-Json -AsHashtable
            $document = [System.Text.Encoding]::UTF8.GetString([byte[]] $state.entries["eve.session"]["sessions.v1"]) | ConvertFrom-Json -AsHashtable
            $snapshot = $document.sessions["message-session"]
            if ($snapshot.revision -ne 8 -or $snapshot.turns.Count -ne 4) { throw "消息会话磁盘修订不符" }
            foreach ($index in @(0, 2)) {
              if ($snapshot.turns[$index].status.state -ne "Failed" -or
                  $snapshot.turns[$index].status.failure.code -ne "Cancelled" -or
                  $snapshot.turns[$index].status.failure.started_tools -ne 0) { throw "修订取消记录未落盘" }
            }
            foreach ($index in @(1, 3)) {
              if ($snapshot.turns[$index].status.state -ne "Completed" -or
                  $snapshot.turns[$index].status.messages.Count -ne 4) { throw "修订工具历史未保存" }
              $revision = $snapshot.turns[$index].status.messages[0].text | ConvertFrom-Json -AsHashtable
              if ($revision.base_request -cne "旧任务" -or $revision.changes.Count -ne 2 -or
                  $revision.changes[0].kind -cne "supplement" -or $revision.changes[0].text -cne "包含本地回执" -or
                  $revision.changes[1].kind -cne "correction" -or $revision.changes[1].text -cne "回执内容改为新任务回执") { throw "用户原文修订未正确保存" }
            }
          }
      - name: 验证流式跨进程恢复及取消输入过滤
        if: ${{ !cancelled() && steps.process-binaries.outcome == 'success' }}
        run: |
          $streamDirectory = Join-Path $env:RUNNER_TEMP "eve-stream-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          function Invoke-Stream([string] $Mode) {
            $output = @(& python -X utf8 scripts/run-prebuilt.py --example session_recovery -- $streamDirectory $Mode)
            if ($LASTEXITCODE -ne 0 -or $output.Count -ne 1) { throw "流式进程验收失败" }
            Write-Host $output[0]
            return ($output[0] | ConvertFrom-Json -AsHashtable)
          }
          $first = Invoke-Stream "--stream"
          $second = Invoke-Stream "--stream"
          $cancelled = Invoke-Stream "--cancel-stream"
          $last = Invoke-Stream "--stream"
          if ($first.turn_id -ne 1 -or $first.tool_executions -ne 1 -or $first.saved_events -ne 1 -or $first.provider_requests -ne 2) { throw "首次流式工具往返不符" }
          if ($second.turn_id -ne 2 -or $second.history_messages -ne 4 -or $second.tool_executions -ne 0 -or $second.saved_events -ne 1) { throw "流式历史恢复不符" }
          if ($cancelled.mode -ne "cancelled" -or $cancelled.turn_id -ne 3 -or $cancelled.history_messages -ne 6 -or $cancelled.tool_executions -ne 0 -or $cancelled.saved_events -ne 0) { throw "流取消结果不符" }
          if ($last.turn_id -ne 4 -or $last.history_messages -ne 6 -or $last.tool_executions -ne 0 -or $last.saved_events -ne 1) { throw "取消输入过滤或旧工具次数不符" }
          $state = Get-Content -LiteralPath (Join-Path $streamDirectory "state.json") -Raw -Encoding utf8 | ConvertFrom-Json -AsHashtable
          $document = [System.Text.Encoding]::UTF8.GetString([byte[]] $state.entries["eve.session"]["sessions.v1"]) | ConvertFrom-Json -AsHashtable
          $snapshot = $document.sessions["demo-session"]
          if ($snapshot.revision -ne 8 -or $snapshot.turns[2].status.state -ne "Failed" -or $snapshot.turns[2].status.failure.code -ne "Cancelled") { throw "实际取消记录未正确保存" }
      - name: 验证会话与工具历史跨进程恢复及中断
        if: ${{ !cancelled() && steps.process-binaries.outcome == 'success' }}
        run: |
          $sessionDirectory = Join-Path $env:RUNNER_TEMP "eve-session-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          function Invoke-Session([string] $Mode) {
            if ($Mode -eq "pending") {
              $output = @(& python -X utf8 scripts/run-prebuilt.py --example session_recovery -- $sessionDirectory --leave-pending)
            } else {
              $output = @(& python -X utf8 scripts/run-prebuilt.py --example session_recovery -- $sessionDirectory)
            }
            if ($LASTEXITCODE -ne 0 -or $output.Count -ne 1) { throw "会话进程验收失败" }
            Write-Host $output[0]
            return ($output[0] | ConvertFrom-Json -AsHashtable)
          }
          $first = Invoke-Session "completed"
          if ($first.turn_id -ne 1 -or $first.history_messages -ne 0 -or $first.tool_executions -ne 1 -or $first.provider_requests -ne 2) { throw "首次工具轮次结果不符" }
          $second = Invoke-Session "completed"
          if ($second.turn_id -ne 2 -or $second.history_messages -ne 4 -or $second.tool_executions -ne 0 -or $second.provider_requests -ne 1) { throw "会话历史未恢复或旧工具被重放" }
          $pending = Invoke-Session "pending"
          if ($pending.mode -ne "pending" -or $pending.turn_id -ne 3 -or $pending.history_messages -ne 6 -or $pending.tool_executions -ne 0 -or $pending.provider_requests -ne 0) { throw "未完成轮次构造不符" }
          $recovered = Invoke-Session "completed"
          if ($recovered.turn_id -ne 4 -or $recovered.history_messages -ne 6 -or $recovered.interrupted -ne 1 -or $recovered.tool_executions -ne 0) { throw "Pending 恢复或失败输入过滤不符" }
          $state = Get-Content -LiteralPath (Join-Path $sessionDirectory "state.json") -Raw -Encoding utf8 | ConvertFrom-Json -AsHashtable
          $document = [System.Text.Encoding]::UTF8.GetString([byte[]] $state.entries["eve.session"]["sessions.v1"]) | ConvertFrom-Json -AsHashtable
          $snapshot = $document.sessions["demo-session"]
          if ($document.format_version -ne 1 -or $snapshot.revision -ne 8 -or $snapshot.turns.Count -ne 4 -or $snapshot.turns[2].status.state -ne "Interrupted" -or $snapshot.turns[0].status.messages.Count -ne 4) { throw "实际磁盘会话记录不符" }
      - name: 验证认知循环无输入推进与三个独立进程零重放
        if: ${{ !cancelled() && steps.process-binaries.outcome == 'success' }}
        run: |
          $directory = Join-Path $env:RUNNER_TEMP "eve-cognition-loop-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $reports = @()
          foreach ($mode in @("seed", "run", "run")) {
            $output = @(& python -X utf8 scripts/run-prebuilt.py --example cognition_loop -- $directory $mode)
            if ($LASTEXITCODE -ne 0) { throw "认知循环独立进程失败" }
            $output | ForEach-Object { Write-Host $_ }
            $reports += (($output -join "`n") | ConvertFrom-Json -AsHashtable)
          }
          if ($reports[0].revision -ne 1 -or $reports[0].status -ne "Ready" -or
              $reports[1].restored_revision -ne 1 -or $reports[1].revision -ne 3 -or
              $reports[1].status -ne "Completed" -or $reports[1].model_requests -ne 2 -or
              $reports[1].tool_executions -ne 1 -or $reports[1].admitted_tool_calls -ne 1 -or
              $reports[2].restored_revision -ne 3 -or $reports[2].revision -ne 3 -or
              $reports[2].model_requests -ne 0 -or $reports[2].tool_executions -ne 0) {
            throw "认知循环保存、无输入执行或零重放不符"
          }
          foreach ($report in $reports) {
            if (-not $report.old_services_closed -or -not $report.directory_reopened) {
              throw "认知循环句柄或目录锁没有关闭"
            }
          }
          $disk = Get-Content -LiteralPath (Join-Path $directory "state.json") -Raw -Encoding utf8 | ConvertFrom-Json -AsHashtable
          $bytes = [byte[]]$disk.entries["eve.cognition"]["cognition.v1"]
          $snapshot = [System.Text.Encoding]::UTF8.GetString($bytes) | ConvertFrom-Json -AsHashtable
          if ($snapshot.subject_id -ne "eve" -or $snapshot.revision -ne 3 -or
              $snapshot.state.goals.demo.status -ne "Completed" -or
              -not $snapshot.state.goals.demo.feedback.verification_met) {
            throw "磁盘认知反馈没有保存"
          }
      - name: 验证两次独立进程恢复状态
        if: ${{ !cancelled() && steps.process-binaries.outcome == 'success' }}
        run: |
          function Assert-SavedCounter([string] $Directory, [string] $ExpectedStarts) {
            $snapshotPath = Join-Path $Directory "state.json"
            $snapshot = Get-Content -LiteralPath $snapshotPath -Raw -Encoding utf8 | ConvertFrom-Json -AsHashtable
            $starts = $snapshot.entries["demo.state-recovery"].starts
            if ($snapshot.version -ne 1 -or $starts -isnot [array] -or
                (ConvertTo-Json -InputObject $starts -Compress) -cne $ExpectedStarts) {
              throw "磁盘快照必须保存版本 1 和 starts 字节数组 $ExpectedStarts"
            }
          }

          $stateDirectory = Join-Path $env:RUNNER_TEMP "eve-state-recovery-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $firstOutput = @(& python -X utf8 scripts/run-prebuilt.py --example state_recovery -- $stateDirectory)
          if ($LASTEXITCODE -ne 0) { throw "首次状态恢复示例执行失败" }
          $firstOutput | ForEach-Object { Write-Host $_ }
          if ($firstOutput.Count -eq 0 -or $firstOutput[0] -cne "恢复前值：无；写入后值：1。") {
            throw "首次启动必须从空状态写入计数 1"
          }
          Assert-SavedCounter $stateDirectory "[49]"

          $secondOutput = @(& python -X utf8 scripts/run-prebuilt.py --example state_recovery -- $stateDirectory)
          if ($LASTEXITCODE -ne 0) { throw "第二次状态恢复示例执行失败" }
          $secondOutput | ForEach-Object { Write-Host $_ }
          if ($secondOutput.Count -eq 0 -or $secondOutput[0] -cne "恢复前值：1；写入后值：2。") {
            throw "第二次启动必须恢复计数 1 并写入计数 2"
          }
          Assert-SavedCounter $stateDirectory "[50]"

  msrv:
    name: 最低 Rust 版本 / 1.95.0
    runs-on: ubuntu-latest
    # 包含原 Codex 依赖的首次编译及定向回归；真实 QQ/Web 进程复用 qqbot.yml 的 1.95 作业。
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: 解析本次核验的源码版本
        id: ci-source
        shell: bash
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_REQUESTED_SOURCE: ${{ inputs.source_revision }}
          CI_EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re

          requested = os.environ.get("CI_REQUESTED_SOURCE", "")
          selected = ""
          if os.environ["CI_EVENT_NAME"] == "workflow_dispatch" and requested:
              if re.fullmatch(r"[0-9a-fA-F]{40}", requested) is None:
                  raise SystemExit("source_revision 必须是完整 40 位十六进制 commit SHA")
              selected = requested.lower()
          expected = selected or os.environ["CI_EVENT_SHA"]
          if re.fullmatch(r"[0-9a-f]{40}", expected) is None:
              raise SystemExit("事件源码 SHA 无效")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"checkout_ref={selected}\nexpected_sha={expected}\n")
          PY
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.ci-source.outputs.checkout_ref }}
      - name: 核对实际源码并记录工作流来源
        shell: bash
        env:
          CI_EXPECTED_SOURCE: ${{ steps.ci-source.outputs.expected_sha }}
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_EVENT_SHA: ${{ github.sha }}
          CI_WORKFLOW_SHA: ${{ github.workflow_sha }}
          CI_RUN_ID: ${{ github.run_id }}
          CI_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          actual = subprocess.check_output(
              ["git", "--no-optional-locks", "rev-parse", "HEAD"], text=True
          ).strip()
          expected = os.environ["CI_EXPECTED_SOURCE"]
          identity = {
              "workflow_sha": os.environ["CI_WORKFLOW_SHA"],
              "github_sha": os.environ["CI_EVENT_SHA"],
              "actual_source_sha": actual,
              "expected_source_sha": expected,
              "event_name": os.environ["CI_EVENT_NAME"],
              "run_id": os.environ["CI_RUN_ID"],
              "run_attempt": os.environ["CI_RUN_ATTEMPT"],
          }
          if any(re.fullmatch(r"[0-9a-f]{40}", identity[key]) is None
                 for key in ("workflow_sha", "github_sha", "actual_source_sha", "expected_source_sha")):
              raise SystemExit("工作流或检出源码身份无效")
          if any(re.fullmatch(r"[1-9][0-9]*", identity[key]) is None
                 for key in ("run_id", "run_attempt")):
              raise SystemExit("工作流运行身份无效")
          print(json.dumps(identity, ensure_ascii=False, sort_keys=True))
          if actual != expected:
              raise SystemExit("实际检出 HEAD 与要求核验的完整源码 SHA 不一致")
          PY
      - name: 核对保留的 Codex 原文件
        run: python3 scripts/verify-codex-upstream.py
      - name: 安装最低支持版本
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy
          rustc +1.95.0 --version --verbose
          cargo +1.95.0 --version
      - name: 检查最低版本的所有构建目标
        id: msrv-targets
        run: cargo +1.95.0 check --workspace --all-targets --locked
      - name: 验证最低版本的公共模型会话契约
        if: ${{ !cancelled() && steps.msrv-targets.outcome == 'success' }}
        run: cargo +1.95.0 test -p eve-llm-api --lib --locked
      - name: 验证最低版本的原 Codex Responses 传输与恢复
        if: ${{ !cancelled() && steps.msrv-targets.outcome == 'success' }}
        run: cargo +1.95.0 test -p eve-llm-codex --lib --test responses --locked
      - name: 验证最低版本的原 OpenAI Chat、Responses 与会话回归
        if: ${{ !cancelled() && steps.msrv-targets.outcome == 'success' }}
        run: |
          cargo +1.95.0 tree -p eve-llm-openai -e features -i serde_json --locked
          cargo +1.95.0 test -p eve-llm-openai --locked
      - name: 验证最低版本的主辅选择、九组合与识图入口
