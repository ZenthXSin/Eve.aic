name: QQBot 通道离线验收
on:
  pull_request:
    paths:
      - "connectors/qqbot/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/qqbot.yml"
      - ".github/workflows/qqbot-training.yml"
      - ".github/qqbot-training-request.json"
      - ".github/scripts/**"
      - ".github/workflows/qqbot-training-review.yml"
      - ".github/qqbot-training-review-request.json"
      - ".github/workflows/qqbot-policy-benchmark.yml"
      - ".github/qqbot-policy-benchmark-request.json"
  push:
    branches: [main]
    paths:
      - "connectors/qqbot/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/qqbot.yml"
      - ".github/workflows/qqbot-training.yml"
      - ".github/qqbot-training-request.json"
      - ".github/scripts/**"
      - ".github/workflows/qqbot-training-review.yml"
      - ".github/qqbot-training-review-request.json"
      - ".github/workflows/qqbot-policy-benchmark.yml"
      - ".github/qqbot-policy-benchmark-request.json"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: 安装 SDK 依赖
        working-directory: connectors/qqbot
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 记录实际依赖锁定结果
        working-directory: connectors/qqbot
        run: node -e 'console.log(JSON.stringify(JSON.parse(require("fs").readFileSync("package-lock.json","utf8"))))'
      - name: 验证实际 SDK 导出
        working-directory: connectors/qqbot
        run: node --input-type=module -e 'const { QQBot } = await import("@tencent-connect/qqbot-nodejs"); if (typeof QQBot !== "function") throw new Error("SDK facade missing");'
      - name: Node 桥接测试
        working-directory: connectors/qqbot
        run: npm test
      - name: 安装 Rust
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt --component clippy
      - name: 验证通道依赖构建
        run: |
          cargo +1.89.0 fmt --all -- --check
          cargo +1.89.0 check --workspace --all-targets --locked
      - name: 实际 Eve QQBot 进程验收
        run: |
          cargo +1.89.0 build -p eve-app --bin eve-qqbot --locked
          python3 connectors/qqbot/test/eve_e2e.py
          python3 connectors/qqbot/test/message_judge_test.py
          python3 connectors/qqbot/test/web_panel_test.py
          python3 connectors/qqbot/test/cognition_test.py
          python3 connectors/qqbot/test/goal_feedback_test.py
          python3 connectors/qqbot/test/memory_test.py
          python3 connectors/qqbot/test/recall_test.py
          python3 connectors/qqbot/test/learning_test.py
          python3 connectors/qqbot/test/learning_decision_test.py
          python3 connectors/qqbot/test/interest_test.py
          python3 connectors/qqbot/test/research_test.py
          python3 connectors/qqbot/test/practice_test.py
          python3 connectors/qqbot/test/skill_test.py
          python3 connectors/qqbot/test/outreach_test.py
          python3 connectors/qqbot/test/journey_test.py
          python3 connectors/qqbot/test/segment_test.py
          python3 -m unittest discover -s connectors/qqbot/test -p 'training_test.py'
          python3 -m unittest discover -s .github/scripts -p 'test_qqbot_replace_run.py'
          python3 -m unittest discover -s connectors/qqbot/test -p 'review_test.py'
          python3 -m unittest discover -s connectors/qqbot/test -p 'compare_test.py'
      - name: 留出领域：静态网页在真实无头 Chrome 中的实践与完整行为链
        run: |
          export EVE_TEST_BROWSER="$(command -v google-chrome)"
          "$EVE_TEST_BROWSER" --version
          cargo +1.89.0 test -p eve-practice-browser --test real --locked -- --ignored --nocapture
          python3 connectors/qqbot/test/holdout_test.py
