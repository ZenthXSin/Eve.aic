          python3 connectors/qqbot/test/admin_test.py
          python3 connectors/qqbot/test/trigger_test.py
          python3 connectors/qqbot/test/background_task_test.py
          python3 connectors/qqbot/test/delegation_context_test.py
          python3 connectors/qqbot/test/subagent_profiles_test.py
          python3 connectors/qqbot/test/group_chat_test.py
          python3 connectors/qqbot/test/group_relation_test.py
          python3 connectors/qqbot/test/group_wakeup_test.py
          python3 connectors/qqbot/test/context_reset_test.py
          python3 connectors/qqbot/test/session_archive_test.py
          python3 connectors/qqbot/test/group_digest_test.py
          python3 connectors/qqbot/test/group_recall_test.py
          python3 connectors/qqbot/test/background_recovery_test.py
          python3 connectors/qqbot/test/background_diagnostics_test.py
          python3 connectors/qqbot/test/ask_once_test.py
          python3 connectors/qqbot/test/health_watch_test.py
          python3 connectors/qqbot/test/auto_recovery_test.py
          python3 connectors/qqbot/test/management_access_test.py
          python3 connectors/qqbot/test/member_development_test.py
          python3 connectors/qqbot/test/model_switch_test.py
          python3 connectors/qqbot/test/model_streaming_test.py
          python3 connectors/qqbot/test/model_timeout_test.py
          python3 connectors/qqbot/test/delivery_recovery_test.py
          python3 connectors/qqbot/test/compaction_stream_test.py
          python3 connectors/qqbot/test/adaptive_context_test.py
          python3 connectors/qqbot/test/completion_test.py
