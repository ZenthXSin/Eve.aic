name: QQBot 通道离线验收
on:
  pull_request:
    paths:
      - "connectors/qqbot/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/*cargo*.py"
      - "scripts/test-web-model-adapter.py"
      - ".github/workflows/qqbot.yml"
      - ".github/workflows/qqbot-training.yml"
      - ".github/qqbot-training-request.json"
      - ".github/scripts/**"
      - ".github/workflows/qqbot-training-review.yml"
      - ".github/qqbot-training-review-request.json"
      - ".github/workflows/qqbot-policy-benchmark.yml"
      - ".github/qqbot-policy-benchmark-request.json"
  push:
    branches: [main]
    paths:
      - "connectors/qqbot/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/*cargo*.py"
      - "scripts/test-web-model-adapter.py"
      - ".github/workflows/qqbot.yml"
      - ".github/workflows/qqbot-training.yml"
      - ".github/qqbot-training-request.json"
      - ".github/scripts/**"
      - ".github/workflows/qqbot-training-review.yml"
      - ".github/qqbot-training-review-request.json"
      - ".github/workflows/qqbot-policy-benchmark.yml"
      - ".github/qqbot-policy-benchmark-request.json"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    # 全量验收含真实离线Cargo编译；实测主场景及浏览器约40分钟，保留最后热更新验收时间。
    timeout-minutes: 50
    # 与 Stable/MSRV 一致；完整交接会多次校验可执行文件，不把调试信息作为验收负载。
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: 安装 SDK 依赖
        working-directory: connectors/qqbot
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 记录实际依赖锁定结果
        working-directory: connectors/qqbot
        run: node -e 'console.log(JSON.stringify(JSON.parse(require("fs").readFileSync("package-lock.json","utf8"))))'
      - name: 验证实际 SDK 导出
        working-directory: connectors/qqbot
        run: node --input-type=module -e 'const { QQBot } = await import("@tencent-connect/qqbot-nodejs"); if (typeof QQBot !== "function") throw new Error("SDK facade missing");'
      - name: Node 桥接测试
        working-directory: connectors/qqbot
        run: npm test
      - name: 独立生图适配器本地上游验收
        run: python3 imgadapter/test_adapter.py
      - name: 安装 Rust
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: 验证通道依赖构建
        run: |
          cargo +1.95.0 fmt -- --check
          cargo +1.95.0 check --workspace --all-targets --locked
      - name: 准备并验证实际脚本隔离环境
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-all --ro-bind / / --dev /dev --proc /proc /usr/bin/true
      - name: 编译实际 Eve QQBot、Web 与记忆进程
        id: adapter-process-binaries
        run: |
          set -x
          cargo +1.95.0 build -p eve-app --bin eve-qqbot --bin eve-web --bin eve-memory --locked
      - name: 实际自由探索、静默结束与经历恢复验收
        if: ${{ !cancelled() && steps.adapter-process-binaries.outcome == 'success' }}
        env:
          EVE_QQBOT_BINARY: target/debug/eve-qqbot
        run: python3 connectors/qqbot/test/free_exploration_test.py
      - name: 实际恢复检查点、入站屏障与完整最小组合验收
        if: ${{ !cancelled() && steps.adapter-process-binaries.outcome == 'success' }}
        env:
          EVE_QQBOT_BINARY: target/debug/eve-qqbot
        run: python3 -B connectors/qqbot/test/startup_checkpoint_test.py
      - name: 实际独立 Web 适配器切换、会话与身份验收
        if: ${{ !cancelled() && steps.adapter-process-binaries.outcome == 'success' }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/eve-adapter-process-evidence"
          python3 scripts/test-web-model-adapter.py 2>&1 | tee "${RUNNER_TEMP}/eve-adapter-process-evidence/web.log"
      - name: 实际 QQ 适配器指令、工具切换与身份验收
        if: ${{ !cancelled() && steps.adapter-process-binaries.outcome == 'success' }}
        run: |
          set -euo pipefail
          set -x
          mkdir -p "${RUNNER_TEMP}/eve-adapter-process-evidence"
          python3 connectors/qqbot/test/model_adapter_test.py 2>&1 | tee "${RUNNER_TEMP}/eve-adapter-process-evidence/qq.log"
      - name: 实际 QQ 热更新交接与回执去重验收
        if: ${{ !cancelled() && steps.adapter-process-binaries.outcome == 'success' }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/eve-adapter-process-evidence"
          python3 connectors/qqbot/test/live_upgrade_test.py 2>&1 | tee "${RUNNER_TEMP}/eve-adapter-process-evidence/live-upgrade.log"
      - name: 实际群聊新回复窗口与未知投递恢复验收
        if: ${{ !cancelled() && steps.adapter-process-binaries.outcome == 'success' }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/eve-adapter-process-evidence"
          python3 connectors/qqbot/test/group_live_anchor_test.py 2>&1 | tee "${RUNNER_TEMP}/eve-adapter-process-evidence/group-live-anchor.log"
      - name: 保存适配器与热更新进程的小型原始结果
        if: ${{ !cancelled() && steps.adapter-process-binaries.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: adapter-process-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/eve-adapter-process-evidence/*.log
          if-no-files-found: error
          retention-days: 7
      - name: 进程验收：Web 与基础对话
        if: ${{ !cancelled() && steps.adapter-process-binaries.outcome == 'success' }}
        run: |
          set -x
          python3 scripts/test-web-chat.py
          python3 scripts/test-web-autonomy.py
          python3 scripts/test-web-goals.py
          python3 connectors/qqbot/test/default_capabilities_test.py
          python3 connectors/qqbot/test/natural_goal_test.py
          python3 connectors/qqbot/test/eve_e2e.py
          python3 connectors/qqbot/test/message_judge_test.py
          python3 connectors/qqbot/test/live_dialogue_test.py
          python3 connectors/qqbot/test/speech_history_test.py
          python3 connectors/qqbot/test/speech_event_context_test.py
          python3 connectors/qqbot/test/live_reminder_test.py
          python3 connectors/qqbot/test/web_panel_test.py
          python3 connectors/qqbot/test/cognition_test.py
          python3 connectors/qqbot/test/goal_feedback_test.py
      - name: 进程验收：记忆、学习与能力形成
        if: ${{ !cancelled() && steps.adapter-process-binaries.outcome == 'success' }}
        run: |
          set -x
          python3 connectors/qqbot/test/memory_test.py
          python3 connectors/qqbot/test/memory_capacity_test.py
          python3 connectors/qqbot/test/conversation_digest_test.py
          python3 connectors/qqbot/test/summary_test.py
          python3 connectors/qqbot/test/recall_test.py
          python3 connectors/qqbot/test/learning_test.py
          python3 connectors/qqbot/test/learning_decision_test.py
          python3 -B connectors/qqbot/test/message_learning_flow_test.py --binary target/debug/eve-qqbot
          python3 connectors/qqbot/test/interest_test.py
          python3 connectors/qqbot/test/research_test.py
          python3 connectors/qqbot/test/practice_test.py
          python3 connectors/qqbot/test/strategy_test.py
          python3 connectors/qqbot/test/skill_test.py
          python3 connectors/qqbot/first-goal-acceptance.py --help
      - name: 进程验收：工具执行、隔离与桥接
        if: ${{ !cancelled() && steps.adapter-process-binaries.outcome == 'success' }}
        run: |
          set -x
          python3 connectors/qqbot/test/toolforge_test.py
          python3 connectors/qqbot/test/dialogue_tools_test.py
          python3 connectors/qqbot/test/developer_tools_test.py
          python3 connectors/qqbot/test/business_restriction_ingress_test.py
          python3 connectors/qqbot/test/trusted_review_originals_test.py
          EVE_TEST_PLUGIN_TOOLCHAIN=1.95.0 python3 connectors/qqbot/test/script_runtime_test.py
          python3 connectors/qqbot/test/file_import_test.py
          python3 connectors/qqbot/test/workflow_tools_test.py
          python3 connectors/qqbot/test/vision_test.py
          python3 connectors/qqbot/test/sticker_test.py
          EVE_TEST_UPGRADE_TOOLCHAIN=1.95.0 python3 connectors/qqbot/test/self_upgrade_timeout_test.py
          python3 connectors/qqbot/test/transport_test.py
      - name: 进程验收：模型请求、缓存与执行进展
        if: ${{ !cancelled() && steps.adapter-process-binaries.outcome == 'success' }}
        run: |
          set -x
          python3 connectors/qqbot/test/people_test.py
          python3 connectors/qqbot/test/phrases_test.py
          python3 connectors/qqbot/test/model_health_test.py
          python3 connectors/qqbot/test/cache_metrics_test.py
          python3 connectors/qqbot/test/model_retry_test.py
          python3 connectors/qqbot/test/request_timing_test.py
          python3 connectors/qqbot/test/admission_benchmark.py --binary target/debug/eve-qqbot --payload-mib 1 --samples 2
          python3 connectors/qqbot/test/memory_continuity_test.py
          python3 connectors/qqbot/test/commitment_test.py
          python3 connectors/qqbot/test/provision_test.py
          python3 connectors/qqbot/test/memory_eval.py
          python3 connectors/qqbot/test/tool_progress_test.py
          python3 connectors/qqbot/test/slow_progress_test.py
          python3 connectors/qqbot/test/stage_feedback_test.py
      - name: 进程验收：上下文、源码查阅与自主探索
        if: ${{ !cancelled() && steps.adapter-process-binaries.outcome == 'success' }}
        run: |
          set -x
          python3 connectors/qqbot/test/history_window_test.py
          python3 connectors/qqbot/test/layered_context_test.py
          python3 connectors/qqbot/test/history_digest_test.py
          python3 connectors/qqbot/test/debounce_test.py
          python3 connectors/qqbot/test/plan_test.py
          python3 connectors/qqbot/test/semantic_test.py
          python3 connectors/qqbot/test/budget_test.py
          python3 connectors/qqbot/test/reference_test.py
          python3 connectors/qqbot/test/source_lookup_test.py
          python3 connectors/qqbot/test/deferred_reply_test.py
          python3 connectors/qqbot/test/clarify_test.py
          python3 connectors/qqbot/test/agenda_test.py
          python3 connectors/qqbot/test/reminder_test.py
          python3 connectors/qqbot/test/execution_test.py
          python3 connectors/qqbot/test/admin_test.py
          python3 connectors/qqbot/test/trigger_test.py
          python3 connectors/qqbot/test/idle_loop_test.py
          python3 connectors/qqbot/test/continuous_autonomy_test.py
      - name: 进程验收：后台任务与群聊记忆
        if: ${{ !cancelled() && steps.adapter-process-binaries.outcome == 'success' }}
        run: |
          set -x
          python3 connectors/qqbot/test/background_task_test.py
          python3 connectors/qqbot/test/task_progress_test.py
          python3 connectors/qqbot/test/default_goal_journey_test.py
          python3 connectors/qqbot/test/background_completion_test.py
          python3 connectors/qqbot/test/background_wait_test.py
          python3 connectors/qqbot/test/delegation_context_test.py
          python3 connectors/qqbot/test/subagent_profiles_test.py
          python3 connectors/qqbot/test/group_chat_test.py
          python3 connectors/qqbot/test/conversation_learning_test.py
          python3 connectors/qqbot/test/group_relation_test.py
          python3 connectors/qqbot/test/group_wakeup_test.py
          python3 connectors/qqbot/test/context_reset_test.py
          python3 connectors/qqbot/test/context_notes_test.py
          python3 connectors/qqbot/test/agent_prompt_reload_test.py
          python3 connectors/qqbot/test/session_archive_test.py
          python3 connectors/qqbot/test/group_digest_test.py
          python3 connectors/qqbot/test/group_recall_test.py
      - name: 进程验收：恢复、管理与模型传输
        if: ${{ !cancelled() && steps.adapter-process-binaries.outcome == 'success' }}
        run: |
          set -x
          python3 connectors/qqbot/test/background_recovery_test.py
          python3 connectors/qqbot/test/background_diagnostics_test.py
          python3 connectors/qqbot/test/ask_once_test.py
          python3 connectors/qqbot/test/health_watch_test.py
          python3 connectors/qqbot/test/auto_recovery_test.py
          python3 connectors/qqbot/test/management_access_test.py
          python3 connectors/qqbot/test/member_development_test.py
          python3 connectors/qqbot/test/model_switch_test.py
          python3 connectors/qqbot/test/model_streaming_test.py
          python3 connectors/qqbot/test/model_timeout_test.py
          python3 connectors/qqbot/test/session_diagnostics_test.py
          python3 connectors/qqbot/test/permission_inspection_test.py
          python3 connectors/qqbot/test/delivery_recovery_test.py
      - name: 进程验收：持续任务与训练评审
        if: ${{ !cancelled() && steps.adapter-process-binaries.outcome == 'success' }}
        run: |
          set -x
          python3 connectors/qqbot/test/compaction_stream_test.py
          python3 connectors/qqbot/test/adaptive_context_test.py
          python3 connectors/qqbot/test/completion_test.py
          python3 connectors/qqbot/test/pursuit_test.py
          python3 connectors/qqbot/test/outreach_test.py
          python3 connectors/qqbot/test/journey_test.py
          python3 connectors/qqbot/test/receipt_capacity_test.py
          python3 connectors/qqbot/test/segment_test.py
          python3 -m unittest discover -s connectors/qqbot/test -p 'training_test.py'
          python3 -m unittest discover -s .github/scripts -p 'test_qqbot_replace_run.py'
          python3 -m unittest discover -s connectors/qqbot/test -p 'review_test.py'
          python3 -m unittest discover -s connectors/qqbot/test -p 'compare_test.py'
      - name: 留出领域：静态网页在真实无头 Chrome 中的实践与完整行为链
        run: |
          export EVE_TEST_BROWSER="$(command -v google-chrome)"
          "$EVE_TEST_BROWSER" --version
          cargo +1.95.0 test -p eve-practice-browser --test real --locked -- --ignored --nocapture
          python3 connectors/qqbot/test/holdout_test.py
      - name: 真实离线 Cargo 编译、热切换与 QQ 进程恢复
        env:
          RUSTUP_TOOLCHAIN: "1.95.0"
        run: python3 scripts/test-cargo-isolation.py
