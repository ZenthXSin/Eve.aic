name: QQBot 通道离线验收
on:
  pull_request:
    paths:
      - "connectors/qqbot/**"
      - "crates/qqbot-plugin/**"
      - "crates/eve-app/**"
      - ".github/workflows/qqbot.yml"
  push:
    branches: [main]
    paths: ["connectors/qqbot/**", "crates/qqbot-plugin/**", "crates/eve-app/**"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: 安装 SDK 依赖
        working-directory: connectors/qqbot
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 记录实际依赖锁定结果
        working-directory: connectors/qqbot
        run: node -e 'console.log(JSON.stringify(JSON.parse(require("fs").readFileSync("package-lock.json","utf8"))))'
      - name: 验证实际 SDK 导出
        working-directory: connectors/qqbot
        run: node --input-type=module -e 'const { QQBot } = await import("@tencent-connect/qqbot-nodejs"); if (typeof QQBot !== "function") throw new Error("SDK facade missing");'
      - name: Node 桥接测试
        working-directory: connectors/qqbot
        run: npm test
      - name: 安装 Rust
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt --component clippy
      - name: 格式化与编译首版（格式结果用于提交）
        run: |
          cargo +1.89.0 fmt --all
          cargo +1.89.0 check --workspace --all-targets --locked
      - name: 实际 Eve QQBot 进程验收
        run: |
          cargo +1.89.0 build -p eve-app --bin eve-qqbot --locked
          python3 connectors/qqbot/test/eve_e2e.py
      - name: 记录格式化文件以供同步
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          paths = subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          files = {p: pathlib.Path(p).read_text() for p in paths if p.endswith(".rs")}
          print("EVE_FORMATTED_FILES=" + json.dumps(files, ensure_ascii=True))
          PY
