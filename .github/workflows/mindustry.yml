name: Mindustry 真实运行验收

# 用固定版本、校验摘要的 Mindustry 无头服务端实际加载最小模组，区分确定性替身与真实运行证据。
on:
  pull_request:
    paths:
      - "crates/practice-api/**"
      - "crates/practice-plugin/**"
      - "crates/practice-mindustry/**"
      - "crates/skill-api/**"
      - "crates/skill-plugin/**"
      - "crates/outreach-api/**"
      - "crates/outreach-plugin/**"
      - "crates/eve-app/**"
      - "crates/dialogue-tools/**"
      - "connectors/qqbot/test/dialogue_tools_test.py"
      - "connectors/qqbot/test/practice_test.py"
      - "connectors/qqbot/test/skill_test.py"
      - "connectors/qqbot/test/outreach_test.py"
      - "connectors/qqbot/test/journey_test.py"
      - "connectors/qqbot/test/fake_mindustry.py"
      - "connectors/qqbot/test/member_development_test.py"
      - "crates/developer-api/**"
      - "crates/developer-tools/**"
      - ".github/workflows/mindustry.yml"
      - "vendor/mindustry-mod-validator/**"
      - "scripts/mod_validator_acceptance.py"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches: [main]
    paths:
      - "crates/practice-api/**"
      - "crates/practice-plugin/**"
      - "crates/practice-mindustry/**"
      - "crates/skill-api/**"
      - "crates/skill-plugin/**"
      - "crates/outreach-api/**"
      - "crates/outreach-plugin/**"
      - "crates/eve-app/**"
      - "crates/dialogue-tools/**"
      - "connectors/qqbot/test/dialogue_tools_test.py"
      - "connectors/qqbot/test/practice_test.py"
      - "connectors/qqbot/test/skill_test.py"
      - "connectors/qqbot/test/outreach_test.py"
      - "connectors/qqbot/test/journey_test.py"
      - "connectors/qqbot/test/fake_mindustry.py"
      - "connectors/qqbot/test/member_development_test.py"
      - "crates/developer-api/**"
      - "crates/developer-tools/**"
      - ".github/workflows/mindustry.yml"
      - "vendor/mindustry-mod-validator/**"
      - "scripts/mod_validator_acceptance.py"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real:
    name: Mindustry v160.7 无头服务端
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MINDUSTRY_VERSION: v160.7
      MINDUSTRY_SHA256: f7b899a4038b95b14a824d5f8993984f79d73baa3254c385b6538327f9c0befd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: 下载并校验 Mindustry 服务端
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/server-release.jar" \
            "https://github.com/Anuken/Mindustry/releases/download/${MINDUSTRY_VERSION}/server-release.jar"
          echo "${MINDUSTRY_SHA256}  $RUNNER_TEMP/server-release.jar" | sha256sum -c -
          java -version
      - name: 安装 Rust
        run: rustup toolchain install 1.89.0 --profile minimal
      - name: 运行器在真实服务端中的加载、警告与崩溃证据
        env:
          EVE_MINDUSTRY_SERVER_JAR: ${{ runner.temp }}/server-release.jar
        run: cargo +1.89.0 test -p eve-practice-mindustry --test real --locked -- --ignored --nocapture
      - name: 实际 Eve QQBot 进程用真实服务端完成实践
        env:
          EVE_MINDUSTRY_SERVER_JAR: ${{ runner.temp }}/server-release.jar
        run: |
          cargo +1.89.0 build -p eve-app --bin eve-qqbot --locked
          python3 connectors/qqbot/test/practice_test.py PracticeAcceptance.test_real_runtime_verifies_the_drafted_mod
      - name: 实际 Eve QQBot 进程用真实服务端验证技能与后续调用
        env:
          EVE_MINDUSTRY_SERVER_JAR: ${{ runner.temp }}/server-release.jar
        run: python3 connectors/qqbot/test/skill_test.py SkillAcceptance.test_real_runtime_verifies_skill_holdout_and_invocation
      - name: 普通成员隔离编译 Java 模组并由真实服务端加载和交付
        env:
          EVE_MINDUSTRY_SERVER_JAR: ${{ runner.temp }}/server-release.jar
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          python3 connectors/qqbot/test/member_development_test.py
      - name: 实际 Eve QQBot 进程用真实服务端走完整行为链（阶段之间独立重启）
        env:
          EVE_MINDUSTRY_SERVER_JAR: ${{ runner.temp }}/server-release.jar
        run: python3 connectors/qqbot/test/journey_test.py
      - name: 对话工具直接运行真实模组并跨进程核对不重放
        env:
          EVE_MINDUSTRY_SERVER_JAR: ${{ runner.temp }}/server-release.jar
        run: python3 connectors/qqbot/test/dialogue_tools_test.py DialogueToolsAcceptance.test_direct_practice_persists_real_evidence_and_restarts_without_replay
  validator:
    name: 继承的模组验证器（从源码构建）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_VERSION: "9.3.1"
      GRADLE_SHA256: b266d5ff6b90eada6dc3b20cb090e3731302e553a27c5d3e4df1f0d76beaff06
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 下载并校验 Gradle
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gradle.zip" \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          echo "${GRADLE_SHA256}  $RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          java -version
      - name: 构建验证器
        working-directory: vendor/mindustry-mod-validator
        run: '"$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin/gradle" --no-daemon fatJar'
      - name: 用示例模组验收
        run: python3 scripts/mod_validator_acceptance.py vendor/mindustry-mod-validator/build/libs/mindustry-mod-validator-1.0.0-all.jar
