<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Eve.aic 总体架构图</title>
  <desc id="desc">Rust Runtime 内核、插件图、认知层、持久化状态和外部世界的总体关系。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/>
    </marker>
    <style>
      .bg{fill:#0b1020}.panel{fill:#111a2e;stroke:#334155;stroke-width:2}.kernel{fill:#172554;stroke:#60a5fa;stroke-width:2}.plugin{fill:#123329;stroke:#34d399;stroke-width:2}.cognition{fill:#241a45;stroke:#a78bfa;stroke-width:2}.state{fill:#172b3d;stroke:#38bdf8;stroke-width:2}.external{fill:#321b33;stroke:#f472b6;stroke-width:2}.future{fill:#2f2614;stroke:#f59e0b;stroke-width:2}.title{font:700 30px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#f8fafc}.subtitle{font:400 16px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#94a3b8}.label{font:700 18px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#f8fafc}.small{font:400 14px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#cbd5e1}.tiny{font:400 12px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#94a3b8}.arrow{stroke:#94a3b8;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.arrow-blue{stroke:#60a5fa;stroke-width:2.5;fill:none;marker-end:url(#arrow-blue)}.dash{stroke-dasharray:8 7}
    </style>
  </defs>

  <rect class="bg" width="1600" height="1000"/>
  <text class="title" x="70" y="62">Eve.aic · Everything is a Plugin Runtime</text>
  <text class="subtitle" x="70" y="90">Rust 核心运行时把插件、状态、事件和未来认知能力组织成可演化的系统底座</text>

  <rect class="panel" x="50" y="125" width="1500" height="110" rx="18"/>
  <text class="label" x="80" y="158">外部世界与入口</text>
  <rect class="external" x="80" y="175" width="220" height="40" rx="10"/><text class="small" x="190" y="201" text-anchor="middle">User / Chat / API</text>
  <rect class="external" x="330" y="175" width="220" height="40" rx="10"/><text class="small" x="440" y="201" text-anchor="middle">World Events</text>
  <rect class="external" x="580" y="175" width="220" height="40" rx="10"/><text class="small" x="690" y="201" text-anchor="middle">CLI / Host</text>
  <rect class="external" x="830" y="175" width="220" height="40" rx="10"/><text class="small" x="940" y="201" text-anchor="middle">Filesystem / Network</text>
  <rect class="future" x="1080" y="175" width="220" height="40" rx="10"/><text class="small" x="1190" y="201" text-anchor="middle">WASM / Process Plugins</text>
  <rect class="future" x="1330" y="175" width="180" height="40" rx="10"/><text class="small" x="1420" y="201" text-anchor="middle">未来入口</text>

  <path class="arrow" d="M190 235 L190 275"/><path class="arrow" d="M440 235 L440 275"/><path class="arrow" d="M690 235 L690 275"/><path class="arrow" d="M940 235 L940 275"/><path class="arrow" d="M1190 235 L1190 275"/>

  <rect class="kernel" x="50" y="275" width="1500" height="180" rx="18"/>
  <text class="label" x="80" y="310">AGI Kernel · Rust Runtime</text>
  <text class="tiny" x="80" y="333">只负责运行环境、边界、生命周期和资源所有权，不负责具体认知能力</text>
  <rect class="panel" x="80" y="355" width="165" height="70" rx="10"/><text class="small" x="162" y="383" text-anchor="middle">Runtime</text><text class="tiny" x="162" y="405" text-anchor="middle">启动 / 停止 / 恢复</text>
  <rect class="panel" x="265" y="355" width="165" height="70" rx="10"/><text class="small" x="347" y="383" text-anchor="middle">Registry</text><text class="tiny" x="347" y="405" text-anchor="middle">插件 / 服务登记</text>
  <rect class="panel" x="450" y="355" width="165" height="70" rx="10"/><text class="small" x="532" y="383" text-anchor="middle">Lifecycle</text><text class="tiny" x="532" y="405" text-anchor="middle">依赖 / 状态 / 清理</text>
  <rect class="panel" x="635" y="355" width="165" height="70" rx="10"/><text class="small" x="717" y="383" text-anchor="middle">Context</text><text class="tiny" x="717" y="405" text-anchor="middle">唯一运行时边界</text>
  <rect class="panel" x="820" y="355" width="165" height="70" rx="10"/><text class="small" x="902" y="383" text-anchor="middle">Event Bus</text><text class="tiny" x="902" y="405" text-anchor="middle">插件解耦协作</text>
  <rect class="panel" x="1005" y="355" width="165" height="70" rx="10"/><text class="small" x="1087" y="383" text-anchor="middle">Scheduler</text><text class="tiny" x="1087" y="405" text-anchor="middle">任务 / 取消 / 等待</text>
  <rect class="panel" x="1190" y="355" width="165" height="70" rx="10"/><text class="small" x="1272" y="383" text-anchor="middle">Permission</text><text class="tiny" x="1272" y="405" text-anchor="middle">声明 / 检查 / 限制</text>
  <rect class="panel" x="1375" y="355" width="135" height="70" rx="10"/><text class="small" x="1442" y="383" text-anchor="middle">Diagnostics</text><text class="tiny" x="1442" y="405" text-anchor="middle">日志 / 状态</text>

  <path class="arrow-blue" d="M800 455 L800 500"/>
  <rect class="plugin" x="50" y="500" width="1500" height="190" rx="18"/>
  <text class="label" x="80" y="535">Plugin Graph · 一切能力都通过插件接入</text>
  <rect class="plugin" x="80" y="560" width="160" height="90" rx="12"/><text class="small" x="160" y="595" text-anchor="middle">LLM</text><text class="tiny" x="160" y="620" text-anchor="middle">Provider / Router</text>
  <rect class="plugin" x="260" y="560" width="160" height="90" rx="12"/><text class="small" x="340" y="595" text-anchor="middle">Memory</text><text class="tiny" x="340" y="620" text-anchor="middle">State / Recall</text>
  <rect class="plugin" x="440" y="560" width="160" height="90" rx="12"/><text class="small" x="520" y="595" text-anchor="middle">World Model</text><text class="tiny" x="520" y="620" text-anchor="middle">Objects / Relations</text>
  <rect class="plugin" x="620" y="560" width="160" height="90" rx="12"/><text class="small" x="700" y="595" text-anchor="middle">Personality</text><text class="tiny" x="700" y="620" text-anchor="middle">Traits / Values</text>
  <rect class="plugin" x="800" y="560" width="160" height="90" rx="12"/><text class="small" x="880" y="595" text-anchor="middle">Motivation</text><text class="tiny" x="880" y="620" text-anchor="middle">Drive / Goals</text>
  <rect class="plugin" x="980" y="560" width="160" height="90" rx="12"/><text class="small" x="1060" y="595" text-anchor="middle">Learning</text><text class="tiny" x="1060" y="620" text-anchor="middle">Experience / Concepts</text>
  <rect class="plugin" x="1160" y="560" width="160" height="90" rx="12"/><text class="small" x="1240" y="595" text-anchor="middle">Capability</text><text class="tiny" x="1240" y="620" text-anchor="middle">Skills / Executors</text>
  <rect class="plugin" x="1340" y="560" width="170" height="90" rx="12"/><text class="small" x="1425" y="595" text-anchor="middle">Self Improvement</text><text class="tiny" x="1425" y="620" text-anchor="middle">Sandbox / Benchmark</text>

  <path class="arrow" d="M250 690 L250 740"/><path class="arrow" d="M550 690 L550 740"/><path class="arrow" d="M850 690 L850 740"/><path class="arrow" d="M1150 690 L1150 740"/><path class="arrow" d="M1450 690 L1450 740"/>
  <rect class="state" x="50" y="740" width="1500" height="150" rx="18"/>
  <text class="label" x="80" y="775">持续状态与演化边界</text>
  <rect class="state" x="100" y="800" width="250" height="55" rx="10"/><text class="small" x="225" y="833" text-anchor="middle">Persistent State Store</text>
  <rect class="state" x="390" y="800" width="250" height="55" rx="10"/><text class="small" x="515" y="833" text-anchor="middle">Snapshots / Recovery</text>
  <rect class="state" x="680" y="800" width="250" height="55" rx="10"/><text class="small" x="805" y="833" text-anchor="middle">Benchmark / Evaluation</text>
  <rect class="future" x="970" y="800" width="250" height="55" rx="10"/><text class="small" x="1095" y="833" text-anchor="middle">Version / Rollback</text>
  <rect class="future" x="1260" y="800" width="250" height="55" rx="10"/><text class="small" x="1385" y="833" text-anchor="middle">Plugin Evolution</text>

  <text class="tiny" x="80" y="940">第一版：Kernel + Plugin Runtime + Event + Service + State + Task + Cleanup + Recovery</text>
  <text class="tiny" x="1520" y="940" text-anchor="end">未来：WASM / Process / Self-evolving Plugins</text>
</svg>
