    "crates/clarify-api",
    "crates/clarify-plugin",
    "crates/commitment-api",
    "crates/provision-api",
    "crates/apply-patch",
    "crates/command-policy",
    "crates/provision-plugin",
    "crates/commitment-plugin",
    "crates/reminder-api",
    "crates/reminder-plugin",
    "crates/task-api",
    "crates/task-plugin",
    "crates/history-digest",
    "crates/completion-api",
