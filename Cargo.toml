[workspace]
members = [
    "crates/web-panel-api",
    "crates/web-panel",
    "crates/learning-api",
    "crates/learning-plugin",
    "crates/plugin-api",
    "crates/cognition-api",
    "crates/cognition-plugin",
    "crates/cognition-loop-api",
    "crates/cognition-loop-plugin",
    "crates/config-api",
    "crates/config-plugin",
    "crates/kernel",
    "crates/state-postgres",
    "crates/llm-api",
    "crates/agent-prompt",
    "crates/llm-openai",
    "crates/jev",
    "crates/session-api",
    "crates/session-plugin",
    "crates/control-api",
    "crates/control-plugin",
    "crates/message-api",
    "crates/message-plugin",
    "crates/runtime",
    "crates/eve-app",
    "crates/qqbot-plugin",
    "crates/training-api",
    "crates/training-plugin",
    "crates/memory-api",
    "crates/memory-plugin",
    "crates/segment-api",
    "crates/segment-plugin",
    "crates/example-plugins",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.89"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
ring = "0.17"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
tempfile = "3"
