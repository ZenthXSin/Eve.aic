[workspace]
members = [
    "crates/plugin-api",
    "crates/config-api",
    "crates/config-plugin",
    "crates/kernel",
    "crates/llm-api",
    "crates/agent-prompt",
    "crates/llm-openai",
    "crates/session-api",
    "crates/session-plugin",
    "crates/control-api",
    "crates/control-plugin",
    "crates/message-api",
    "crates/message-plugin",
    "crates/runtime",
    "crates/eve-app",
    "crates/example-plugins",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.89"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
tempfile = "3"
